<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#035589">
  <meta name="robots" content="noindex">
  <title>מקצר קישורים · טירת כרמל</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top__in">
      <img class="logo" src="logo.png" alt="עיריית טירת כרמל: סביבה טובה בין כרמל לים">
      <h1>מקצר<br>קישורים</h1>
    </div>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </header>

  <main class="wrap">
    <section class="card">
      <form id="form" autocomplete="off">
        <label for="long">הדביקו קישור ארוך</label>
        <input id="long" type="text" inputmode="url" spellcheck="false" placeholder="https://…" required dir="ltr">

        <label for="slug">סיומת משלכם <span class="opt">(לא חובה)</span></label>
        <div class="slug">
          <span class="slug__base" id="basePreview" dir="ltr"></span>
          <input id="slug" type="text" placeholder="hanukkah" dir="ltr" maxlength="40">
        </div>
        <p class="hint">אותיות באנגלית, ספרות ומקף. אם תשאירו ריק, תיווצר סיומת קצרה אוטומטית.</p>

        <button class="btn btn--main btn--big" type="submit" id="go">קצרו לי</button>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </section>

    <section class="card result" id="result" hidden>
      <div class="status" id="status"></div>
      <div class="short">
        <a id="shortUrl" href="#" target="_blank" rel="noopener" dir="ltr"></a>
      </div>
      <div class="row">
        <button class="btn btn--blue" id="copy">העתקה</button>
        <button class="btn btn--ghost" id="share">שיתוף</button>
        <button class="btn btn--ghost" id="qrBtn">קוד QR</button>
      </div>
      <div class="qr" id="qr" hidden></div>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>הקישורים שלי</h2>
        <input id="search" type="search" placeholder="חיפוש…">
      </div>
      <ul class="list" id="list"><li class="empty">טוען…</li></ul>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../podtc/vendor/qrcode/qrcode.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
