name: Deploy to GitHub Pages

# Publishes the game (static site at the repo root) to GitHub Pages.
on:
  push:
    branches: [claude/nicky-cleanup-game-g4cvvu, claude/upbeat-sagan-7731px]
  workflow_dispatch: # allows manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; newer pushes cancel older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # turn GitHub Pages on automatically if it isn't already

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # index.html lives at the repository root

      # the artifact is sometimes not listed yet right after the upload; a short pause avoids a failed deploy
      - name: Wait for the artifact to be listed
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
