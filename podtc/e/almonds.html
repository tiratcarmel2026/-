  <div id="app"><noscript><h1>טירת השקדים</h1><p>זוכרים את השם הישן של המקום? בתקופה העות'מאנית כינו את הכפר שעמד כאן טירת אל־לוז, טירת השקדים. מתברר שהשם הזה לא נבחר במקרה.
השקד הוא אחד העצים העתיקים והמוכרים בארץ ישראל. הוא גדל בר באזורים הים תיכוניים, ועל מורדות הכרמל מצא תנאים מושלמים: חורף גשום, קיץ חם ויבש וקרקע מתנקזת. האיכרים של הכפר נטעו על המדרונות מטעים שלמים של שקדים, לצד הזיתים, והמראה של הגבעות הלבנות בפריחה היה כנראה מה שנתן לכפר את כינויו.
השקד הוא הראשון לפרוח בשנה. כבר בינואר ובפברואר, כששאר העצים עוד ערומים, הוא מתכסה בפרחים לבנים וורודים. לכן הוא הפך לסמל של ט&quot;ו בשבט, ולכן קוראים לו בעברית שקד, מלשון שקידה וזריזות: הוא ממהר להתעורר לפני כולם.
אם אתם כאן בסוף החורף, חפשו עצי שקד בחצרות ובשולי השבילים בעלייה לכרמל. ואם אתם כאן בעונה אחרת, דמיינו את המדרונות שמעליכם לבנים כולם, כמו שראו אותם תושבי המקום לפני מאות שנים.</p></noscript></div>
