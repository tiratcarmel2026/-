  <div id="app"><noscript><h1>קיץ 1948</h1><p>הפרק הזה עוסק באחד הרגעים הקשים בתולדות המקום, וההיסטוריונים והקהילות השונות מספרים אותו בדרכים שונות.
בסוף שנת אלף תשע מאות ארבעים ושבע, עם פרוץ הקרבות שאחרי החלטת החלוקה, היה הכפר א־טירה אחד הכפרים הגדולים והחזקים בדרום חיפה. הוא שלט על הדרך הראשית לאורך החוף, ולפי המקורות היהודיים נורו ממנו יריות על כלי רכב שנסעו בכביש. כבר בדצמבר אלף תשע מאות ארבעים ושבע הותקף הכפר לראשונה, ובסוף אפריל אלף תשע מאות ארבעים ושמונה, במהלך הקרב על חיפה, נערכה עליו התקפה רחבה נוספת.
בשבועות שאחר כך עזבו רבים מתושבי הכפר. באמצע יולי, בקרבות עשרת הימים שבין שתי ההפוגות, נכבש הכפר. לפי המקורות זה קרה בשישה עשר ביולי. תושביו שנותרו עזבו או גורשו, ורבים מהם הפכו לפליטים. כמה ימים אחר כך יצא צה&quot;ל למבצע שוטר נגד כפרי המשולש הקטן שמדרום.
עבור היהודים שהגיעו לכאן אחרי המלחמה, זו הייתה ההתחלה של בית חדש. עבור משפחות א־טירה, שצאצאיהן מפוזרים היום בארצות שכנות ובמקומות אחרים, זהו סיפור של אובדן.
אין צורך לבחור בין שני הסיפורים כדי להבין את המקום. מספיק להקשיב לשניהם.</p></noscript></div>
