  <div id="app"><noscript><h1>רוסטם בסטוני</h1><p>יש סיפורים של מקום שמתחילים בבית אחד ומגיעים עד לכנסת. זה אחד מהם.
רוסטם בסטוני נולד בחיפה בחמישה עשר במרץ אלף תשע מאות עשרים ושלוש, למשפחה שמוצאה מהכפר א־טירה, הכפר שעל אדמותיו עומדת היום טירת כרמל. הוא למד אדריכלות בטכניון, ובמקביל עסק בעיתונאות ובפוליטיקה.
בשנת אלף תשע מאות חמישים ואחת הצטרף לחוג הערבי של מפ&quot;ם. הוא הוצב במקום העשירי ברשימה, המפלגה זכתה בחמישה עשר מושבים, וכך נכנס לכנסת השנייה. בסטוני נחשב לערבי הישראלי הראשון שייצג בכנסת מפלגה ציונית.
הדרך לא הייתה ישרה. הוא פרש מהמפלגה עם קבוצה שנקראה &quot;הסיעה השמאלית&quot;, ובשנת אלף תשע מאות חמישים וארבע חזר למפ&quot;ם. בבחירות של אלף תשע מאות חמישים וחמש הוא כבר לא נבחר, ולא חזר לכנסת.
עוד פרט קטן: האחיין שלו, חסן בסטוני, היה השחקן הערבי הראשון שהגיע לליגה הלאומית בכדורגל.
כשעומדים כאן, בלב העיר הוותיקה, כדאי לזכור שההיסטוריה של המקום הזה כוללת גם אנשים שהלכו בדרכים שאיש לא הלך בהן לפניהם.</p></noscript></div>
