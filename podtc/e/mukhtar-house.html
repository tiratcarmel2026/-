  <div id="app"><noscript><h1>בית המוח'תאר</h1><p>בכל כפר בתקופה העות'מאנית ובתקופת המנדט הבריטי היה מוח'תאר, ראש הכפר. הוא היה האיש שמייצג את התושבים מול השלטונות, גובה מסים, רושם לידות ופותר סכסוכים. הבית שלו היה בדרך כלל אחד הגדולים והמרשימים בכפר, כי שם התקבלו האורחים ושם התנהלו העניינים החשובים.
בכפר א־טירה היה זה ביתו של המוח'תאר עבד אללה סלמאן. הבית שרד את המלחמה ואת כל השינויים שבאו אחריה, וקיבל תפקיד חדש לגמרי: הוא משמש כתחנת המשטרה של טירת כרמל.
יש אירוניה מעניינת בסיפור הזה. הבית שבו ישב פעם האיש שאחראי על הסדר בכפר, ממשיך עד היום לשמש מקום שאחראי על הסדר בעיר, רק תחת דגל אחר ושלטון אחר.
יחד עם בית הכנסת אם הבנים, שהיה פעם המסגד של הכפר, ועם מבנה בית הספר הישן, בית המוח'תאר הוא אחת העדויות האחרונות שנשארו מהכפר שעמד כאן לפני שנת אלף תשע מאות ארבעים ושמונה.
כשאתם עוברים כאן, נסו לזהות את מה שמסגיר את גילו של המבנה: קירות אבן עבים, חלונות מקושתים, ותקרות גבוהות שנועדו לשמור על קרירות בקיץ החם של מישור החוף.</p></noscript></div>
