  <div id="app"><noscript><h1>מתחם תע&quot;ש</h1><p>במערב העיר, בין השכונות לבין כביש החוף, משתרע מתחם גדול של התעשייה הצבאית, תע&quot;ש. במשך עשורים פעל כאן מפעל ביטחוני, מוקף גדרות, שרוב התושבים מעולם לא נכנסו אליו.
המתחם הזה הוא אחד הסיפורים הגדולים של העתיד של טירת כרמל. תוכנית המתאר הכוללנית של העיר, שאושרה בוועדה המחוזית בחיפה בשנת אלפיים עשרים ושתיים, מייעדת את השטח לשכונה חדשה ענקית, עם כחמשת אלפים יחידות דיור, לאחר שהמפעל יתפנה.
התוכנית כולה שאפתנית במיוחד. היא מוסיפה לעיר כשנים עשר אלף יחידות דיור, כמחציתן בהתחדשות עירונית של שכונות ותיקות, ומכוונת לאוכלוסייה של כשמונים ושישה אלף תושבים בעתיד. כיום גרים בטירת כרמל כשלושים ושניים אלף איש, כלומר העיר עשויה כמעט לשלש את עצמה.
עבור העיר זו הזדמנות לחבר את עצמה מחדש אל הים, שהיה קרוב כל הזמן אבל מנותק ממנה על ידי כבישים, מסילה ומפעלים.
כשאתם מביטים לעבר הגדרות, נסו לדמיין רחובות, גנים ובתי ספר. בעוד כמה שנים, ייתכן מאוד שמישהו יעמוד בדיוק כאן ויאזין לפודקאסט על השכונה החדשה שצמחה במקום המפעל.</p></noscript></div>
