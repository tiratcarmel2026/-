  <div id="app"><noscript><h1>לב העיר הוותיקה</h1><p>ברוכים הבאים ללב טירת כרמל. אתם עומדים בערך במקום שבו שכן במשך מאות שנים כפר שנקרא א־טירה. השם טירה פירושו מבצר או מקום מבוצר, ובתקופה העות'מאנית כינו את הכפר גם טירת אל־לוז, כלומר טירת השקדים, בגלל מטעי השקדים שכיסו את המורדות.
ההיסטוריה כאן עמוקה יותר. בתקופה הצלבנית עמד באזור כפר נוצרי שהצלבנים קראו לו סנט ג'ון דה טירה. ברישומי המס העות'מאניים מסוף המאה השש עשרה מופיע הכפר עם כחמישים ושניים משקי בית, ובתקופת המנדט הבריטי הוא כבר היה אחד הכפרים הגדולים במבואות חיפה, עם יותר מחמשת אלפים תושבים שהתפרנסו בעיקר מזיתים, מחיטה ומעדרי עזים.
בקיץ אלף תשע מאות ארבעים ושמונה, במלחמת העצמאות, נכבש הכפר ותושביו עזבו או גורשו. זהו פרק כואב ושנוי במחלוקת, והוא חלק בלתי נפרד מסיפור המקום.
כבר בשנת אלף תשע מאות ארבעים ותשע הגיעו לכאן עולים חדשים, והכפר הישן הפך לבסיס של יישוב חדש. כשתסתובבו ברחובות, נסו לחפש את מדרונות הכרמל ממזרח ואת מישור החוף ממערב. בדיוק המיקום הזה, בין ההר לים, הוא שהפך את המקום ליישוב מבוקש כבר לפני מאות שנים.</p></noscript></div>
