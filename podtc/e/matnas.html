  <div id="app"><noscript><h1>המתנ&quot;ס ומרכז האומנויות</h1><p>ברחוב ז'בוטינסקי ארבעים ושלוש, במרכז האומנויות של העיר, פועל המתנ&quot;ס של טירת כרמל, המרכז הקהילתי. אם תשאלו ילדים בעיר איפה הם מבלים אחר הצהריים, רבים מהם יענו: כאן.
המתנ&quot;סים בישראל קמו בשנות השישים והשבעים, בדיוק עבור ערים כמו טירת כרמל. המטרה הייתה לתת לעולים ולילדיהם מקום לפגוש זה את זה, ללמוד, ליצור ולהרגיש שייכים. בטירת כרמל, עיר שכל גלי העלייה עברו בה, המשימה הזו חשובה במיוחד.
היום פועלים במתנ&quot;ס חוגים לכל הגילים: מהגיל הרך, דרך ילדים ונוער, ועד צעירים ומבוגרים. יש מוזיקה, רובוטיקה, מחול, טניס ותיאטרון קהילתי, יש הצגות ילדים ואירועים משפחתיים, ובקיץ יש קייטנות. יחד עם העירייה הקים המתנ&quot;ס בעיר גם מתחם נינג'ה, מסלול מכשולים לילדים, וקייטנות נינג'ה לילדי כיתות א' עד ו'.
לצד המתנ&quot;ס פועל מאז אלפיים וחמש מרכז הצעירים של טירת כרמל, שמלווה בני שמונה עשרה עד שלושים וחמש בלימודים, בתעסוקה ובתרבות.
ויש גם חלום שעדיין מחכה: היכל תרבות של ממש, עם כשש מאות מקומות, שהעירייה מבקשת להקים כדי שהעיר הצומחת תקבל במה ראויה.</p></noscript></div>
