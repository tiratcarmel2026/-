  <div id="app"><noscript><h1>חי בר כרמל</h1><p>במרחק נסיעה קצרה מטירת כרמל, בלב שמורת הכרמל, פועלת מאז אלף תשע מאות שבעים ושלוש שמורת חי בר כרמל. המטרה שלה פשוטה וגדולה: להחזיר לטבע בעלי חיים שנעלמו מהארץ.
במכלאות מרווחות מגדלים כאן חמישה מיני פרסתנים: היחמור הפרסי, אייל הכרמל, הצבי הישראלי, כבש הבר האירני ועז הבר הכרתית. לצדם פועל מרכז לגידול עופות דורסים, ובראשם הנשר.
הסיפור המפורסם ביותר הוא של היחמור. היחמור המקומי נכחד מהארץ, ובמקומו הביאו לכאן קרוב משפחה, את היחמור הפרסי מאיראן. אחרוני היחמורים הגיעו בטיסה האחרונה של אל על שיצאה מאיראן בזמן המהפכה האסלאמית בשנת אלף תשע מאות שבעים ותשע. כשגרעין הרבייה גדל מספיק, החלו לשחרר יחמורים לטבע, בנחל כזיב ובהמשך בנחל שורק, וגם היום משוחררים יחמורים חדשים.
גם הנשרים זכו לסיכוי שני. משנת אלף תשע מאות תשעים ואחת שוחררו נשרים לטבע בכרמל, וחוקרים מעריכים שהם וצאצאיהם הם עשירית או יותר מכל אוכלוסיית הנשרים בישראל.
השמורה פתוחה למבקרים בעיקר בסופי שבוע ובחגים, עם סיורים מודרכים של רשות הטבע והגנים, וכדאי להזמין מראש.</p></noscript></div>
