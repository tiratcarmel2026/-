  <div id="app"><noscript><h1>בית הספר של הכפר</h1><p>רוב המבנים של הכפר א־טירה כבר אינם קיימים, אבל יש כמה עדויות ששרדו. אחת המעניינות שבהן היא מבנה בית הספר של הכפר. לפי תיעוד של ארגון זוכרות, המבנה הישן קיים עד היום ומשמש כחלק מבית הספר המקיף שפירא בטירת כרמל.
יש משהו מרגש ברעיון הזה: בניין שנבנה כדי ללמד את ילדי הכפר לפני יותר משבעים שנה, ממשיך לשמש לאותה מטרה בדיוק, רק עבור ילדים אחרים, בשפה אחרת ובמדינה אחרת. אבני הבניין ראו את כל השינויים שעברו על המקום.
בתקופת המנדט הבריטי היה הכפר אחד הגדולים בסביבת חיפה, ובית הספר שלו היה מוסד חשוב לתושבים. אחרי מלחמת העצמאות ובוא העולים, המבנה נשאר על כנו והשתלב במערכת החינוך של היישוב החדש.
אם תגיעו לבית הספר, חפשו את סגנון הבנייה הישן: אבן מסותתת, חלונות גבוהים וקירות עבים ששומרים על קרירות בקיץ. אלה פרטים קטנים שמספרים סיפור גדול על המקום שבו אתם עומדים.
שימו לב, זהו בית ספר פעיל, ולכן מומלץ להתבונן מבחוץ ולכבד את שגרת התלמידים.</p></noscript></div>
