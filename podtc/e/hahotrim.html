  <div id="app"><noscript><h1>שכונת החותרים</h1><p>בחלק הדרום מערבי של טירת כרמל מתוכננת אחת השכונות הגדולות שהעיר ראתה: שכונת החותרים.
הדרך לכאן הייתה ארוכה. התוכנית של רשות מקרקעי ישראל עברה כעשר שנות תכנון ומחלוקת, בין השאר בין טירת כרמל לבין חיפה, השכנה מצפון. בסוף הושג הסכם פשרה בין ראשי שתי הרשויות, והתוכנית אושרה.
התוכנית חלה על כשמונה מאות דונם, וכוללת כאלפיים מאה חמישים ושלוש יחידות דיור. לצד הדירות מתוכננים כמאה אלף מטרים רבועים לתעסוקה ולמסחר, כדי שתושבים חדשים יוכלו גם לעבוד קרוב לבית.
ויש בתוכנית גם בשורה ירוקה: פארק לאורך נחל גלים, הנחל שיורד מהכרמל וחוצה את מישור החוף בדרכו לים. לצד זה מתוכנן שדרוג של הכניסה הדרומית לעיר.
שכונת החותרים היא חלק מתמונה גדולה יותר. תוכנית המתאר של העיר, שאושרה בשנת אלפיים עשרים ושתיים, מכוונת לכשמונים ושישה אלף תושבים בעתיד, כמעט פי שלושה מהיום. יחד עם השכונה המתוכננת במתחם תע&quot;ש ועם ההתחדשות העירונית במרכז העיר, טירת כרמל צפויה להשתנות מאוד בעשור הקרוב.
מי שיגור כאן בעוד כמה שנים, אולי יטייל בערב בפארק נחל גלים ויתקשה להאמין שפעם היו כאן רק שדות.</p></noscript></div>
