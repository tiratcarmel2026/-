  <div id="app"><noscript><h1>ויצמן־ז'בוטינסקי</h1><p>אתם עומדים באחד המקומות שעומדים להשתנות הכי הרבה בטירת כרמל.
באזור הרחובות ויצמן וז'בוטינסקי מתוכנן אחד מפרויקטי ההתחדשות העירונית הגדולים בצפון. באוקטובר אלפיים עשרים ושש אישרה הוועדה המחוזית להפקיד את התוכנית: אחד עשר בניינים ישנים, עם מאתיים ושש דירות, ייהרסו, ובמקומם יקומו שבעה מגדלים בני שלושים קומות, עם כאלף ומאתיים דירות חדשות.
התוכנית לא כוללת רק דירות. יש בה יותר מחמשת אלפים מטרים רבועים של שטחי ציבור וגני ילדים, והיא יושבת על התוואי המתוכנן של קו המטרו.
ליד המתחם מתכננים עוד פרויקט, עם כחמש מאות וחמישים דירות. וכל זה הוא חלק מתמונה גדולה יותר: אלפי דירות בתכנון, ועיר שקצב הצמיחה שלה הופך אותה לאחת הערים המדוברות בצפון.
לתושבים הוותיקים זה אומר דירה חדשה, מעלית וחניה. לעיר זה אומר דור חדש של תושבים. השאלה הגדולה היא איך שומרים, בתוך כל הבטון, על הקהילה ועל האופי של השכונה.</p></noscript></div>
