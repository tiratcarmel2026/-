  <div id="app"><noscript><h1>בית הכנסת בית תנחום</h1><p>טירת כרמל היא פסיפס של קהילות, ואחת הבולטות שבהן היא קהילת יוצאי הקווקז, המכונים גם יהודי ההרים. רבים מהם עלו לישראל בגל העלייה הגדול מברית המועצות לשעבר בשנות התשעים, והתיישבו כאן, בין הכרמל לים.
בשנת אלפיים ושלוש נחנך בעיר בית הכנסת בית תנחום, בית הכנסת של עולי הקווקז. הוא נקרא על שם אביהם של התורמים שמימנו את הקמתו. מעבר להיותו מקום תפילה, בית הכנסת הפך למרכז קהילתי ותרבותי, ואף לאתר שמגיעים אליו לסיורים מודרכים.
יהודי ההרים שמרו במשך מאות שנים על מסורות ייחודיות, על שפה משלהם, הג'והורי, שהיא ניב של פרסית עם מילים עבריות, ועל מנהגי חג וסעודות מפורסמות. בטירת כרמל אפשר לפגוש את המסורת הזו בחתונות, בחגים ובמטבח.
בית תנחום מסמל את הדרך שבה כל גל עלייה הוסיף שכבה חדשה לעיר: עולי המעברות של שנות החמישים, ואחריהם עולי שנות התשעים, שכל אחד מהם הביא איתו עולם שלם.
אם בית הכנסת פתוח כשאתם כאן, היכנסו בצניעות, והתבוננו בפרטי העיצוב. ואם לא, פשוט עצרו לרגע והקשיבו לשכונה.</p></noscript></div>
