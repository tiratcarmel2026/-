  <div id="app"><noscript><h1>הילד מטירת כרמל שהפך לכוכב רוק</h1><p>בסוף שנות הארבעים נולד בצפון הארץ ילד בשם חיים וייץ. את שנות הילדות הראשונות שלו הוא העביר כאן, בטירת כרמל, בשנים הקשות של המעברות והשיכונים הראשונים, בבית יהודי שומר מסורת.
אמו, פלורה, הייתה ניצולת שואה מהונגריה. היא עברה את מחנות הריכוז ושוחררה במאוטהאוזן במאי אלף תשע מאות ארבעים וחמש, ומכל משפחתה שרד מלבדה רק אח אחד. היא הגיעה לארץ ישראל כדי להתחיל חיים חדשים, כמו רבים מתושבי טירת כרמל של אותן שנים.
כשחיים היה בן שמונה בערך, אחרי שהוריו נפרדו, הוא ואמו היגרו לניו יורק. שם הוא קיבל שם חדש, ג'ין קליין, ובהמשך ג'ין סימונס. בשנות השבעים הקים יחד עם חבריו את להקת הרוק KISS, עם האיפור השחור לבן, הלשון הארוכה ומופעי הענק, והפך לאחד מכוכבי הרוק המפורסמים בעולם.
סימונס סיפר לא פעם בראיונות על הילדות בישראל ועל אמו, שכמעט לא דיברה איתו על מה שעברה בשואה.
יש משהו מדהים בסיפור הזה: מאחד הצריפים הצנועים של עיירת עולים קטנה, יצא ילד שהגיע לבמות הגדולות בעולם. וכמה מהילדים שגדלים היום ברחובות האלה, אולי עוד יפתיעו את כולנו.</p></noscript></div>
