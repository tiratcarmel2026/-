  <div id="app"><noscript><h1>שריפת הכרמל</h1><p>ביום חמישי, השני בדצמבר אלפיים ועשר, פרצה שריפה בשולי עוספיא שבכרמל. בתוך שעות הפכה לשריפת היער הקטלנית ביותר בתולדות המדינה. במשך ארבעה ימים בערה האש על ההר, ונשרפו קרוב לעשרים וחמישה קמ&quot;ר של חורש ויער.
ארבעים וארבעה בני אדם נספו בשריפה, רובם צוערי שירות בתי הסוהר שנסעו באוטובוס כדי לסייע בפינוי האסירים מכלא דמון, לצד שוטרים, כבאים ומתנדבים. כשבעה עשר אלף איש פונו מבתיהם ברחבי הכרמל.
גם טירת כרמל הרגישה את האש מקרוב. הלהבות הגיעו עד שכונת ברוש בעיר, וברחבי האזור חששו שהרוח תדחוף את האש מטירת כרמל צפונה, אל השכונות הדרומיות של חיפה, ותושבים בדניה פונו ללילה. מטוסי כיבוי ממדינות רבות הגיעו לעזור, ורק אחרי ימים ארוכים השתלטו על האש.
בעקבות האסון פרסם מבקר המדינה דוח חריף על מחדלי מערך הכבאות, ומאז עבר המערך רפורמה גדולה.
כשאתם מביטים אל ההר הירוק שמעליכם, זכרו שחלק מהעצים שאתם רואים הם צמחייה צעירה שצמחה מחדש מהאפר. היער מתחדש לאט, וכל אחד מאיתנו אחראי לשמור עליו מפני אש.</p></noscript></div>
