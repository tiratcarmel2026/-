  <div id="app"><noscript><h1>כפר הנוער גלים</h1><p>בין טירת כרמל לים, ליד המקום שבו נחל גלים נשפך אל מישור החוף, נמצא כפר הנוער גלים.
הסיפור שלו מתחיל בתחילת שנות החמישים. בכל רחבי הארץ קמו אז בתי ספר חקלאיים לנוער, חלק מהחזון ללמד את דור העולים הצעיר לעבד את האדמה. גם בחיפה ביקשו להקים בית ספר כזה, ולצורך כך הוקצתה אדמה כאן, ליד טירת כרמל.
היום כפר גלים הוא פנימייה שבה חיים ולומדים כשלוש מאות ועשרים בני נוער: עולים חדשים, צעירים שנשרו ממסגרות אחרות ומקבלים כאן הזדמנות שנייה, ובשנים האחרונות גם צעירים על הרצף האוטיסטי. החווה החקלאית עדיין פעילה, עם רפת, מחלבה ומטעים של בננות ופסיפלורה, והיא עוזרת לממן את הפעילות החינוכית. בכפר פועל גם מיזם ספורט שפתוח לבני נוער מטירת כרמל.
הקרבה לעיר הביאה גם מחלוקות. כשתוכננה ההרחבה של טירת כרמל, ביקשו המתכננים להעביר אליה חלק מאדמות הכפר. אחרי מאבק משפטי הושגה פשרה, ובמקום שבעים דונם הועברו כעשרים וארבעה.
כפר גלים הוא תזכורת שקליטה וחינוך הם לא רק פרק בהיסטוריה של שנות החמישים. הם ממשיכים לקרות כאן כל יום.</p></noscript></div>
