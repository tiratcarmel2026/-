  <div id="app"><noscript><h1>בין העיר לים</h1><p>ממערב לכם נמצא הים התיכון, במרחק של קילומטרים ספורים. אבל מי שגדל בטירת כרמל יודע שהים הזה היה תמיד קרוב ורחוק בו זמנית. בין העיר לבין קו המים עוברים כביש החוף, מסילת הרכבת ושטחים חקלאיים ותעשייתיים, ולטירת כרמל לא היה חוף רחצה משלה.
האזור הזה הוא חלק ממישור חוף הכרמל, רצועה צרה ופורייה שנמתחת בין הר הכרמל לים, מחיפה ועד אזור זכרון יעקב. לאורכה עברו במשך אלפי שנים דרכים חשובות, וגם היום היא מסדרון תחבורה מרכזי בין חיפה למרכז הארץ.
תוכנית המתאר החדשה של העיר מבקשת לשנות את המצב. אחד הרעיונות המרכזיים בה הוא לחבר את טירת כרמל אל הים ולהעניק לה חוף משלה. זה נשמע כמו שינוי קטן, אבל עבור עיר שמזוהה כל השנים עם ההר והתעשייה, מדובר במהפך של ממש.
עצרו רגע, הסתכלו מערבה ונסו לזהות את קו האופק. בימים צלולים אפשר לראות את השקיעה צובעת את הים בכתום, ולהבין למה כל כך הרבה אנשים בוחרים לגור דווקא כאן, בין ההר לבין הים.</p></noscript></div>
