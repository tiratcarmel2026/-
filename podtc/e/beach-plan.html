  <div id="app"><noscript><h1>החוף העירוני שבדרך</h1><p>במשך שנים טירת כרמל הייתה עיר שרואה את הים, אבל לא נוגעת בו. תוכנית המתאר החדשה של העיר רוצה לשנות את זה.
התוכנית, שאושרה בוועדה המחוזית חיפה, מתכננת עיר של כשמונים ושישה אלף תושבים, עם כשנים עשר אלף דירות חדשות. רובן יגיעו מהתחדשות עירונית של השכונות הוותיקות, וחלק גדול משכונה חדשה במתחם תע&quot;ש.
אבל הלב של התוכנית הוא כאן, במערב: השטח מיועד לחוף רחצה, לתיירות חופית, למסחר ולטיילת. שמורת הטבע כלח־גלים שמדרום אמורה להתרחב.
כדי להגיע לים צריך היה לפתור סכסוך קרקעות עם המועצה האזורית חוף הכרמל. הפשרה: רצועה צרה משטח כפר הנוער גלים תאפשר דרך מרחוב הרצל, הרחוב המסחרי הראשי של העיר, ועד חוף הרחצה העירוני המתוכנן.
עוד לא יודעים בדיוק מתי נטבול כאן את הרגליים. אבל בפעם הבאה שתעמדו ברחוב הרצל, דמיינו שבסוף הרחוב מחכה הים.</p></noscript></div>
