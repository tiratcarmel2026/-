  <div id="app"><noscript><h1>הכרמל של אונסק&quot;ו</h1><p>מעל טירת כרמל מתחיל אחד השטחים הירוקים החשובים בישראל. בשנת אלף תשע מאות תשעים ושש הכיר ארגון אונסק&quot;ו של האומות המאוחדות בכרמל כשמורת ביוספרה, הראשונה בישראל.
שמורת ביוספרה היא לא רק שמורת טבע. הרעיון הוא להראות איך בני אדם יכולים לחיות לצד טבע מוגן: בלב השמורה יש אזורי טבע שמורים, סביבם אזורי חיץ, ומסביב יישובים, חקלאות וערים. טירת כרמל, חיפה, עוספיא ודלית אל כרמל הן כולן חלק מהמארג הזה.
בתוך השטח נמצא פארק הכרמל, הגן הלאומי הגדול בישראל, עם יותר ממאה קמ&quot;ר של חורש ים תיכוני, אלונים, אורנים ואלות. חיים בו צבאים, חזירי בר, שועלים, דורבנים וגם יחמורים פרסיים שהושבו לטבע בזכות שמורת חי בר כרמל.
ההכרה הבינלאומית היא גם אחריות. אחרי שריפות גדולות, כמו זו של אלפיים ועשר, השמורה מראה עד כמה הטבע פגיע, ועד כמה חשוב שהקהילות שגרות לידו ישמרו עליו.
בפעם הבאה שאתם עולים בשביל מהעיר אל ההר, זכרו: אתם נכנסים לשטח שהעולם כולו הכיר בו כאוצר טבע.</p></noscript></div>
