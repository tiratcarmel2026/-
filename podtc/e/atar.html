  <div id="app"><noscript><h1>ראובן עטר</h1><p>ברשימת האנשים הבולטים של טירת כרמל יש שם אחד שכל אוהד כדורגל בצפון מכיר: ראובן עטר.
עטר, יליד אלף תשע מאות שישים ושבע, גדל במחלקת הנוער של מכבי חיפה. בשנים שבהן הירוקים הפכו לכוח הגדול של הכדורגל הישראלי, הוא היה חלק מחמש אליפויות ושני גביעי מדינה, ומשם הגיע גם לנבחרת ישראל.
הקריירה שלו עברה גם בהפועל חיפה, בבית&quot;ר ירושלים, בהפועל פתח תקווה ובמכבי נתניה. אחרי שתלה את הנעליים הוא הפך למאמן, ואימן בין היתר את מכבי נתניה. היום הוא קול מוכר בתוכניות הספורט, ובהן התוכניות של רדיו חיפה.
וגם בדור הבא יש עטר על הדשא: הבן, רועי עטר, יליד אלף תשע מאות תשעים וארבע, הוא כדורגלן בעצמו, וסיפר פעם כמה זה לא פשוט לשחק כשאבא שלך הוא אגדה.
בעיר שבה כל ילד חולם על המגרש, הסיפור של עטר הוא תזכורת: אפשר להתחיל במגרש שכונתי ולהגיע עד לנבחרת.</p></noscript></div>
