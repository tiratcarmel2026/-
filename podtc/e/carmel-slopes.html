  <div id="app"><noscript><h1>מורדות הכרמל</h1><p>ממזרח לכם מתרומם הר הכרמל, והעיר טירת כרמל בנויה על מורדותיו המערביים התחתונים. מכאן מתחיל אחד האזורים הירוקים והיפים בצפון הארץ.
מעל העיר זורמים בחורף נחל גלים ונחל כלח, שני נחלים שיורדים מהכרמל לכיוון מישור החוף. המסלול בנחלים האלה נחשב לאחד היפים בכרמל: חורש ים תיכוני שירוק כל השנה, צמחייה עבותה, אלונים, אלות ובני שיח ריחניים. אזור שווייצריה הקטנה, נחל כלח ונחל גלים הוכרז כשמורת יער, וכל האזור הוא חלק מפארק הכרמל, רצף של גנים לאומיים ושמורות טבע שמשתרע מדרום לחיפה ועד נחל מערות.
לא רחוק מכאן פועלת גם שמורת חי בר כרמל של רשות הטבע והגנים, שבה משקמים חיות בר ומחזירים לטבע מינים שנעלמו מהאזור, כמו היחמור הפרסי ועופות דורסים.
הכרמל גם זוכר את השריפה הגדולה של אלפיים ועשר, שפגעה בשטחים נרחבים בהר. מאז היער מתחדש לאט, וזו תזכורת עד כמה חשוב לשמור עליו.
אם יש לכם זמן, נעלו נעליים נוחות, קחו מים, ועלו בשבילים. העיר נמצאת ממש למרגלות אחד האוצרות הטבעיים הגדולים של ישראל.</p></noscript></div>
