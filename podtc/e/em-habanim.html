  <div id="app"><noscript><h1>בית הכנסת אם הבנים</h1><p>ברחוב הפלמ&quot;ח עומד אחד המבנים המיוחדים בצפון הארץ: בית הכנסת אם הבנים. מבחוץ הוא נראה כמו בית כנסת שכונתי, אבל הקירות שלו מספרים סיפור של מאות שנים ושל שלוש דתות.
החוקר הצרפתי ויקטור גרן, שביקר כאן בשנת אלף שמונה מאות ושבעים, העריך שלפני שהמבנה הפך למסגד הוא שימש ככנסייה צלבנית או כמבנה ציבורי אחר, בימים שבהם עמד כאן הכפר הנוצרי סנט ג'ון דה טירה. בתקופה העות'מאנית הפך המבנה למסגד הגדול של הכפר א־טירה, ושנת ההקדשה שלו כמסגד היא אלף חמש מאות שבעים ותשע.
אחרי מלחמת העצמאות, כשהכפר התרוקן מרוב תושביו, הגיעו עולים חדשים מצפון אפריקה והפכו את המבנה הנטוש לבית הכנסת המרכזי של היישוב. עד היום פועל בו בית כנסת של יוצאי מרוקו, עם כמאתיים מקומות ישיבה לגברים ולנשים.
המבנה עצמו מוערך כבן ארבע מאות וחמישים שנה לפחות, וחפירות בסביבה גילו עדויות להתיישבות רציפה כאן מתקופת הברונזה ועד התקופה הביזנטית.
בית הכנסת אם הבנים היה המבנה הראשון בטירת כרמל שהוכרז כאתר מורשת לשימור, ביוזמה משותפת של העירייה, של המועצה לשימור אתרי מורשת ושל העמותה המפעילה אותו. התבוננו באבנים העבות ובקשתות: מעט מבנים בארץ עברו מסע כזה.</p></noscript></div>
