  <div id="app"><noscript><h1>רחוב הרצל</h1><p>כל עיר צריכה רחוב אחד שבו הכול קורה. בטירת כרמל זה רחוב הרצל.
זה הרחוב המסחרי הראשי של העיר. כאן נמצאים חנויות, בתי קפה, בנקים ובניין העירייה, וכאן עוברים רוב התושבים כמעט בכל יום. בעיתונות כבר כתבו על הרחוב שהוא &quot;יהפוך לדיזנגוף&quot; של הצפון, וסיפרו על תושבים מכל האזור שבאים לגור בסביבה.
הרחוב הזה מחזיק גם את העתיד של העיר. לפי תוכנית המתאר, דרך שתתחיל מרחוב הרצל תוביל בעתיד עד לחוף הרחצה העירוני המתוכנן. כלומר, הרחוב שבו קונים לחם בבוקר אמור יום אחד להיות הדרך לים.
נסו להסתכל סביב: הבניינים הנמוכים של שנות החמישים והשישים, השלטים, האנשים שמכירים זה את זה. ותחשבו איך הוא ייראה בעוד עשר שנים, עם מגדלים, רחוב מוצל וזרם של אנשים בדרך לחוף.
רחוב הרצל הוא בעצם סיפור העיר בקטן: מקום צנוע שמתכונן לקפיצה גדולה.</p></noscript></div>
