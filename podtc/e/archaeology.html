  <div id="app"><noscript><h1>מה מסתתר מתחת לרגליים</h1><p>הרבה לפני העולים, לפני הכפר העות'מאני ואפילו לפני הצלבנים, אנשים כבר חיו בדיוק כאן. ממצאי חפירות ארכיאולוגיות בסביבה מעידים על התיישבות רציפה במקום מתקופת הברונזה, לפני יותר מארבעת אלפים שנה, ועד התקופה הביזנטית.
הסיבה פשוטה: מים, אדמה טובה ומיקום. מעיינות הכרמל סיפקו מים כל השנה, המדרונות התאימו לזיתים, לגפנים ולשקדים, והדרך הראשית לאורך החוף עברה ממש למטה.
ברשימות הארכיאולוגיות של טירת כרמל מופיעים שרידי אמת מים ומערת קבורה מהתקופה הרומית, שרידי מבצר מהתקופה הצלבנית, ומסגד שנבנה על יסודות מהתקופה הביזנטית. אולי מכאן בא השם טירה, מבצר: ייתכן שהמקום היה מבוצר כבר מימי קדם.
בכל פעם שחופרים כאן יסודות לבניין חדש, רשות העתיקות בודקת קודם מה מסתתר מתחת לאדמה. כך טירת כרמל ממשיכה לחשוף את העבר שלה גם בזמן שהיא בונה את העתיד.
בפעם הבאה שתראו כאן בור חפירה מגודר, דעו שאולי בדיוק שם נחשף עכשיו פרק נוסף בסיפור של המקום.</p></noscript></div>
