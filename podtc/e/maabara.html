  <div id="app"><noscript><h1>שיכוני העולים הראשונים</h1><p>דמיינו את המקום הזה בחורף של אלף תשע מאות ארבעים ותשע. מדינת ישראל בת פחות משנה, ואלפי עולים מגיעים מדי חודש. כאן, על אדמות הכפר הישן, הוקמו שני מרכזי קליטה לעולים. משפחות שהגיעו מצפון אפריקה, מעיראק, מרומניה ומארצות נוספות קיבלו פח, אוהל או צריף, ובמקרים רבים גם את הבתים הנטושים של הכפר.
החיים במעברה היו קשים: בוץ בחורף, חום כבד בקיץ, תורים למים ועבודות דחק. אבל מתוך הקושי הזה נבנתה קהילה. בשנת אלף תשע מאות חמישים וארבע אוחדו מרכזי הקליטה למועצה מקומית אחת, שקיבלה את השם טירת כרמל.
במשך עשורים נחשבה טירת כרמל לעיירת פיתוח בצל חיפה הגדולה. רבים מתושביה עבדו במפעלים ובנמל של חיפה, וגם בתעשייה שקמה בתוך העיירה עצמה. הדורות שגדלו כאן בנו את העיר מחדש, שכונה אחר שכונה.
בשנת אלף תשע מאות תשעים ושתיים הוכרזה טירת כרמל רשמית כעיר. אם תשאלו כאן תושבים ותיקים, רבים מהם יספרו לכם על ההורים או הסבים שהגיעו למעברה עם מזוודה אחת, והפכו את המקום הזה לבית.</p></noscript></div>
