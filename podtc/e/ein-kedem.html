  <div id="app"><noscript><h1>עין קדם</h1><p>כקילומטר וחצי עד שני קילומטרים ממזרח לטירת כרמל, בערוץ של נחל נדר, מסתתר אחד המקומות הקסומים בכרמל: עין קדם.
עין קדם הוא מעיין שכבה. מי הגשם מחלחלים דרך סלע הגיר של הכרמל, נעצרים בשכבת סלע אטומה ויוצאים החוצה בצלע ההר. מה שמיוחד כאן הוא שהמים לא נובעים סתם מהאדמה: הם זורמים מתוך שתי נקבות, מנהרות שנחצבו בידי אדם בתוך הסלע כדי להגיע אל מקור המים ולהגביר את הזרימה.
אפשר להיכנס לנקבות ולהלך בתוך המים הצלולים והצוננים. הנקבה הימנית קצרה ומסתיימת בבריכה רדודה. השמאלית ארוכה ועמוקה יותר, ובמקומות מסוימים המים מגיעים עד כמטר. התקרה נמוכה והחושך מגיע מהר, אז קחו פנס ונעלי מים, ואל תיכנסו לבד.
המעיין הזה היה מקור המים העיקרי של הכפר א־טירה. שרידי אמת מים בסביבה מראים איך המים הובלו אל השדות והבתים שלמטה.
מגיעים לכאן רק ברגל, בשבילים שיוצאים מקצה העיר. בערך ארבע מאות מטר מתחת למעיין, נחל נדר מצטרף לנחל גלים. בימי קיץ חמים זה אחד המקומות הכי מרעננים באזור, ממש בפתח הבית.</p></noscript></div>
