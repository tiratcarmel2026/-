  <div id="app"><noscript><h1>מרכז העיר מתחדש</h1><p>חלק גדול מהבניינים במרכז טירת כרמל נבנו בשנות החמישים והשישים, בשביל העולים של אז. רבים מהם הזדקנו, ולחלקם אין אפילו מרחבים מוגנים. הפתרון שהעיר בחרה בו הוא התחדשות עירונית, ובעיקר פינוי־בינוי: הורסים בניינים ישנים ובונים במקומם בניינים חדשים, גבוהים יותר, שבהם הדיירים הוותיקים מקבלים דירות חדשות.
ראש העירייה, דודו כהן, הציג חזון של כארבעת אלפים ושבע מאות דירות חדשות בפינוי־בינוי ברחבי העיר.
אחד הפרויקטים הגדולים נמצא כאן, במתחם הרצל, ביאליק ומוצקין. התוכנית כוללת הריסה של חמישה עשר בנייני מגורים עם כמאתיים ועשר דירות, והקמה של כאלף מאתיים שמונים וארבע דירות חדשות בעשרה מבנים בגובה ארבע עשרה עד שלושים קומות, עם כחמישה עשר אלף מטרים רבועים של מסחר, ממש ליד התוואי של המטרונית.
ויש עוד: ברחוב ביאליק מתוכננים שלושה מגדלים במקום שבעים ושתיים דירות ישנות. במתחם שרת יקומו שני מגדלים בני שלושים קומות עם מאתיים ושמונים דירות, במקום ארבעים ושמונה. בשכונת נוף ים יוקמו דירות ומבנה עירייה חדש.
ההתחדשות מעוררת גם שאלות: איך לשמור על הקהילה הוותיקה, על הצל והירוק ועל אופי השכונות. אבל דבר אחד ברור: קו הרקיע של טירת כרמל עומד להשתנות.</p></noscript></div>
