  <div id="app"><noscript><h1>מסלול נחל כלח ונחל גלים</h1><p>אם יש מסלול הליכה אחד שכל מטייל בצפון מכיר, זה כנראה מסלול נחל כלח ונחל גלים, והוא מסתיים ממש בפתח של טירת כרמל.
הגרסה המוכרת היא מסלול מעגלי: חונים ליד צומת דמון שבלב הכרמל, יורדים בנחל כלח וחוזרים בנחל גלים. מי שמעדיף ללכת בכיוון אחד יכול להתחיל בצומת דמון, לרדת לאורך הנחלים ולסיים כאן, בקצה העיר, ליד מלון קדם. רק צריך לדאוג לרכב שני או להסעה בחזרה. מסלול ארוך יותר, של כעשרה קילומטרים, משלב גם את המעיין עין קדם.
רוב הדרך מוצלת בחורש טבעי סבוך: אלונים, אלות, ער אציל וקטלב, עם הריח החריף של צמחי התבלין. בערוץ הנחל יש לפעמים קפיצות מעל סלעים גדולים, ובחורף זורמים בו מים. נחל גלים שקט ועמוס פחות מנחל כלח, וזה בדיוק היתרון שלו.
האזור כולו, שכולל גם את שווייצריה הקטנה, הוכרז כשמורת יער והוא חלק מפארק הכרמל.
לפני שיוצאים: קחו הרבה מים, נעליים טובות ומפה עדכנית, ובדקו את מזג האוויר ואת מצב השבילים. ובקיץ, זכרו שאסור להבעיר אש ביער.</p></noscript></div>
