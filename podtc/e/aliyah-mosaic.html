  <div id="app"><noscript><h1>פסיפס העליות</h1><p>באחת הישיבות של ועדת העלייה והקליטה של הכנסת, שנערכה בטירת כרמל, אמר נציג העיר משפט שמסכם את סיפורה: בטירת כרמל אפשר למצוא את כל השכבות של גלי העלייה השונים בארץ.
זה התחיל במעברות של סוף שנות הארבעים ותחילת שנות החמישים, עם עולים מצפון אפריקה, מעיראק ומאירופה. בשנות התשעים הגיע גל העלייה הגדול מברית המועצות לשעבר, ואיתו גם יהודי ההרים מהקווקז. ובמקביל הגיעו לעיר עולים מאתיופיה. וכמו שאמרו בעירייה, העיר ממשיכה לקלוט עולים גם היום.
אפשר לשמוע את זה ברחוב. בתור בסופרמרקט נשמעות עברית, רוסית, אמהרית וערבית יהודית מרוקאית, ולפעמים כולן באותו משפט. אפשר להריח את זה במטבחים: מאפים קווקזיים, תבשילים מרוקאים, אינג'רה אתיופית ופלמני.
מה שמעניין בטירת כרמל הוא שהעיר הקטנה הזו עשתה בקנה מידה מקומי את מה שהמדינה כולה עשתה: לקחה אנשים מעשרות ארצות, עם שפות ומנהגים שונים, ובנתה מהם קהילה.
עצרו לרגע והקשיבו. כמה שפות אתם שומעים סביבכם עכשיו?</p></noscript></div>
