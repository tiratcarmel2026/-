  <div id="app"><noscript><h1>המטרונית מגיעה לרחוב הרצל</h1><p>רחוב הרצל, הרחוב הראשי של טירת כרמל, עומד לעבור את אחד השינויים הגדולים בתולדותיו: המטרונית מגיעה לעיר.
המטרונית היא מערכת של אוטובוסים מפרקיים ארוכים שנוסעים בנתיבים נפרדים, כמעט כמו רכבת על גלגלים. היא כבר פועלת בחיפה ובקריות, ועכשיו מקדמים תוואי חדש, באורך של כעשרה קילומטרים ועם כשלושים תחנות, בין חיפה לטירת כרמל. הנתיבים יעברו לאורך כביש אחת עשרה בחיפה ולאורך רחוב הרצל כאן, ויתחברו לכביש ארבע ולצומת מת&quot;ם, אחד ממרכזי ההייטק הגדולים בצפון.
ההשקעה בפרויקט כולו מוערכת בכשבע מאות מיליון שקלים. משרד התחבורה ומשרד האוצר כבר הוסיפו תקציבים, העבודות החלו, וחברת חוצה ישראל פרסמה מכרז לביצוע אחד המקטעים.
לצד המטרונית משדרגים גם את הרחוב עצמו: נתיבי תחבורה ציבורית, מדרכות מוצלות ותשתיות ירוקות. לא במקרה, כמה מתוכניות ההתחדשות העירונית הגדולות בעיר ממוקמות ממש ליד התוואי שלה.
דמיינו את הרחוב הזה בעוד כמה שנים: תחנה מקורה, אוטובוס שמגיע כל כמה דקות, ונסיעה לחיפה בלי לחפש חניה. זו הדרך שבה טירת כרמל מתכוננת להיות עיר גדולה.</p></noscript></div>
