  <div id="app"><noscript><h1>שנות ה־80</h1><p>מי שגדל בישראל בעשור האחרון כנראה מכיר את טירת כרמל גם בלי שביקר בה, בזכות הסדרה הקומית שנות השמונים. הסדרה, בכיכובו של הקומיקאי שלום אסייג, יליד העיר, מתרחשת בטירת כרמל של שנות השמונים ומתארת משפחה מקומית, שכנים, בית ספר ואת כל הרגעים המביכים והמצחיקים של התבגרות בעיירה ישראלית.
שלום אסייג נחשב לידוען הגדול ביותר שהעיר הוציאה מתוכה. בהופעות הסטנדאפ שלו הוא מרבה לספר על הילדות בטירת כרמל, על המשפחה ועל ההומור השכונתי, והפך את העיר הקטנה לחלק מהתרבות הישראלית.
מה שמיוחד בסדרה הוא שהיא לא מתייחסת לעיירת הפיתוח בהתנשאות. היא מציגה את החיים כאן באהבה: הצבעים, המוזיקה, המכנסיים הקצרים, הטלוויזיה בשחור לבן והחבר'ה מהשכונה.
אז אם אתם הולכים כאן ברחוב ומרגישים פתאום נוסטלגיה לשנות השמונים, זה לא במקרה. אולי בדיוק בפינה הזו עמד פעם ילד שחלם להצחיק את כל המדינה, והצליח.</p></noscript></div>
