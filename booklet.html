/*
VOICE: official-warm public health, calm and clear, never alarming
IDEA: a printed municipal booklet you leaf through, page by page, right to left
PICTURE: big flat illustrations (animals, saliva drop, tap, clinic) on white paper with one giant brand shape per page
COLOUR and TYPE: Tirat Carmel brand (cyan, yellow, lime, blue, navy) on white; Assistant 800 headlines, 400 body
LAYOUT: one idea per page, huge type, wide margins; spread on desktop, single page on phones
*/
:root{color-scheme:light dark;--stage:light-dark(#e6f5f9,#08233a);--ui:light-dark(#005589,#e6f5f9);--uibg:light-dark(#fff,#0f3352)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--ui);font-family:"AL","AH","NC","NE",sans-serif;overflow:hidden;display:flex;flex-direction:column}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:2600px;touch-action:pan-y}
.scaler{position:relative}
.book{position:absolute;top:0;left:0;transform-origin:0 0;transition:translate .8s cubic-bezier(.3,.7,.2,1)}
.leaf{position:absolute;top:0;left:0;width:560px;height:792px;transform-style:preserve-3d;transform-origin:right center;transition:transform .85s cubic-bezier(.3,.7,.2,1)}
.leaf.flipped{transform:rotateY(180deg)}
.single .leaf{transition:transform .85s cubic-bezier(.3,.7,.2,1),opacity .25s linear .6s}
.single .leaf.flipped{opacity:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 10px 30px rgba(0,40,70,.18)}
.face.back{transform:rotateY(180deg)}
.blank{background:#f4fafc}
.bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar button{min-width:52px;height:48px;border-radius:999px;border:0;background:var(--uibg);color:var(--ui);font:800 17px "AL","AH",sans-serif;padding:0 18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,40,70,.15)}
.bar button:disabled{opacity:.35;cursor:default}
.bar button:focus-visible{outline:3px solid #00BFDD;outline-offset:2px}
.count{font-weight:800;font-size:16px;min-width:150px;text-align:center}
.hint{font-size:14px;opacity:.75}
@media (prefers-reduced-motion:reduce){.leaf,.book{transition:none}}
/* ---------- page design (fixed paper, always light) ---------- */
.pg{position:absolute;inset:0;background:#fff;color:#1D1D1B;direction:rtl;font-family:"AL","AH","NC","NE",sans-serif;color-scheme:light;padding:56px 48px}
.pg h1,.pg h2{margin:0;font-weight:800;line-height:1.02;letter-spacing:-.5px}
.pg h2{font-size:58px;color:#005589}
.pg p{margin:0;font-size:21px;line-height:1.45}
.pg .lead{font-size:24px;line-height:1.35;margin-top:16px}
.pg>*{position:relative}
.pg>.blob,.pg>.pn,.pg>.ft,.pg>.src,.pg>.logozone{position:absolute}
.pg>.blob{border-radius:50%}
.pn{border:4px solid #fff;bottom:26px;left:34px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.ft{position:absolute;bottom:38px;right:48px;font-size:13px;color:#6F6F6E}
.tag{display:inline-block;font-weight:800;font-size:17px;padding:6px 16px;border-radius:999px;margin-bottom:18px}
.ill{display:block}
.row{display:flex;gap:18px;align-items:center;margin-top:22px}
.row svg{flex:0 0 76px;height:76px}
.row b{display:block;font-size:25px;color:#005589;line-height:1.15}
.row span{font-size:19px;line-height:1.35}
.quote{font-size:150px;line-height:.6;font-weight:800;height:62px}
.sig{margin-top:22px;font-size:19px}
.sig b{display:block;font-size:24px;color:#005589}
.flow{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:20px}
.flow .st{display:flex;align-items:center;gap:20px;width:100%;background:#F2FBFD;border-radius:24px;padding:10px 20px}
.flow .st svg{flex:0 0 84px;height:84px}
.flow .st b{font-size:27px;color:#005589}
.flow .ar{height:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.tile{border-radius:26px;padding:12px 6px 10px;text-align:center}
.tile svg{width:100%;height:96px}
.tile b{display:block;font-size:22px;margin-top:2px}
.chip{display:inline-block;background:#fff;border:2px solid #1D1D1B;border-radius:999px;padding:5px 14px;font-size:18px;margin:4px 0 0 6px;text-decoration:line-through;color:#6F6F6E;border-color:#cfd6da}
.signs{list-style:none;padding:0;margin:18px 0 0}
.signs li{font-size:21px;line-height:1.3;padding:10px 0 10px 0;border-bottom:2px dashed #cfe9f0;display:flex;gap:12px;align-items:center}
.signs li i{flex:0 0 16px;height:16px;border-radius:50%;background:#F5BD17}
.huge{font-size:170px;font-weight:800;line-height:.9;color:#005589;letter-spacing:-4px}
.bars{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.bars div{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.bars span.y{flex:0 0 64px}
.bars span.b{height:46px;border-radius:23px 0 0 23px;display:flex;align-items:center;justify-content:flex-end;padding-left:14px;font-size:24px}
.pg.ltr{direction:ltr}.pg.ltr .ft{right:auto;left:48px}.pg.ltr .pn{left:auto;right:34px}
.pg.ltr .bars span.b{border-radius:0 23px 23px 0;padding-left:0;padding-right:14px}
.pg.ltr .rules li{padding-right:0;padding-left:34px}.pg.ltr .rules li::before{right:auto;left:0}
.pg.ltr[data-cover] p{font-size:24px!important;top:330px!important}
.pg.ltr[data-cover] svg{width:250px!important;height:250px!important;left:auto!important;right:30px!important;transform:scaleX(-1)}
.pg.ru h1{font-size:88px!important;top:220px!important}.pg.am h1{font-size:64px!important;top:220px!important;line-height:1.15}
.pg.ru h2{font-size:48px!important}.pg.am h2{font-size:44px!important;line-height:1.2}
.pg.ru p,.pg.am p,.pg.ru li,.pg.am li{letter-spacing:-.1px}
.langs{display:flex;justify-content:center;gap:6px;padding:10px 10px 0}
.langs button{height:40px;min-width:64px;border-radius:999px;border:2px solid transparent;background:var(--uibg);color:var(--ui);font:800 15px "AL","AH","NC","NE",sans-serif;padding:0 14px;cursor:pointer}
.langs button[aria-pressed=true]{border-color:#00BFDD;background:#00BFDD;color:#1D1D1B}
.langs button:focus-visible{outline:3px solid #00BFDD;outline-offset:2px}
.ltrbook .leaf{transform-origin:left center}.ltrbook .leaf.flipped{transform:rotateY(-180deg)}
.src{position:absolute;bottom:84px;right:48px;left:48px;font-size:13px;color:#6F6F6E;line-height:1.35}
.big2{display:flex;gap:16px;margin-top:22px}
.big2 > div{flex:1;border-radius:28px;padding:18px 18px 16px}
.big2 .n{font-size:64px;font-weight:800;line-height:1}
.big2 .l{font-size:19px;line-height:1.3;margin-top:6px}
.pin{display:flex;gap:16px;align-items:flex-start;margin-top:18px}
.pin svg{flex:0 0 34px;height:44px}
.pin b{display:block;font-size:22px;color:#005589}
.pin span{font-size:19px;line-height:1.35}
.steps{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:18px;align-items:center;border-radius:28px;padding:14px 18px}
.step svg{flex:0 0 96px;height:96px}
.step b{display:block;font-size:34px;color:#005589;line-height:1}
.step span{font-size:19px;line-height:1.35;display:block;margin-top:6px}
.rules{list-style:none;padding:0;margin:14px 0 0}
.rules li{font-size:20px;line-height:1.35;margin-bottom:12px;padding-right:34px;position:relative}
.rules li::before{content:"";position:absolute;right:0;top:6px;width:20px;height:20px;border-radius:6px;background:#BFD330}
.bk{background:#005589;color:#fff}
.bk h2{color:#fff}
.ct{border-top:2px solid rgba(255,255,255,.25);padding:14px 0}
.ct b{display:block;font-size:20px;color:#F5BD17}
.ct .ph{font-size:40px;font-weight:800;direction:ltr;display:inline-block;line-height:1.1;color:#F5BD17!important}
.pg a,.pg a[x-apple-data-detectors]{color:inherit;text-decoration:none}
.ct a.ph{cursor:pointer;border-bottom:3px solid rgba(245,189,23,.5)}
.ct span{font-size:17px;line-height:1.35}
.logozone{position:absolute;top:0;left:0;width:250px;height:170px;background:#fff;border-bottom-right-radius:100% 100%;box-shadow:9px 9px 0 0 #00BFDD}
.logozone img{position:absolute;top:30px;left:34px;width:150px}
</style>
</head>

<p style="margin-top:16px">בשנים האחרונות המחלה מתפשטת בישראל, והשנה היא כבר הגיעה גם לחוף הכרמל, לא רחוק מאיתנו.</p>
<p style="margin-top:12px">אגף שפ״ע, יחד עם השירות הווטרינרי העירוני, מטפל בפניות על בעלי חיים משוטטים, מקפיד על פינוי פסולת ומלווה את בעלי חיות המחמד בחובת החיסון והרישוי. אבל ההגנה הטובה ביותר מתחילה בכל אחד ואחת מאיתנו: חיסון בתוקף לכלב, פחים סגורים, לא מאכילים חיות משוטטות, ופונים מהר לטיפול אחרי כל נשיכה או שריטה.</p>

<p style="margin-top:12px">אם הכלב שלכם לא חוסן בשנתיים האחרונות, זה הזמן לקבוע תור. השירות הווטרינרי העירוני כאן בשבילכם.</p>

<div class="quote" style="color:#F5BD17">”</div>
<p class="lead" style="font-weight:800;color:#005589;margin-top:0">Бешенство можно предотвратить. Именно поэтому нам важно, чтобы каждая семья в городе знала, что делать.</p>
<p style="margin-top:16px">В последние годы болезнь распространяется в Израиле, а в этом году она дошла и до побережья Кармеля, недалеко от нас.</p>
<p style="margin-top:12px">Управление благоустройства вместе с городской ветеринарной службой работает с обращениями о бродячих животных, следит за вывозом мусора и помогает владельцам домашних животных с обязательной вакцинацией и регистрацией. Но лучшая защита начинается с каждого из нас: действующая прививка у собаки, закрытые мусорные баки, никакого кормления бродячих животных и быстрое обращение за помощью после любого укуса или царапины.</p>
<div class="sig"><b>Арье Вагнер</b>Начальник управления благоустройства, муниципалитет Тират-Кармеля</div>
<div class="ft">Брошюра: бешенство</div><div class="pn" style="background:#F5BD17">2</div>
</section>
<!-- 3 FOREWORD VET -->
<section lang="ru" dir="ltr" class="pg ltr ru">
<div class="blob" style="width:300px;height:300px;background:#00BFDD;top:-150px;right:-110px"></div>
<span class="tag" style="background:#00BFDD">Слово городского ветеринара</span>
<div class="quote" style="color:#00BFDD">”</div>
<p class="lead" style="font-weight:800;color:#005589;margin-top:0">Животное может быть носителем вируса и при этом выглядеть совершенно здоровым.</p>
<p style="margin-top:16px">Поэтому даже милого щенка на улице не забирают домой. Хотите помочь? Сообщите нам, и мы займёмся этим.</p>
<p style="margin-top:12px">После появления симптомов бешенство почти всегда смертельно. Но у нас есть очень эффективные средства защиты: прививка домашних животных и профилактическое лечение людей, начатое вовремя после контакта.</p>
<p style="margin-top:12px">Если вашу собаку не прививали последние два года, пора записаться. Городская ветеринарная служба здесь для вас.</p>
<div class="sig"><b>Д-р Идо Шион</b>Городской ветеринар, муниципалитет Тират-Кармеля</div>
<div class="ft">Брошюра: бешенство</div><div class="pn" style="background:#00BFDD">3</div>
</section>
<!-- 4 WHAT IS -->
<section lang="ru" dir="ltr" class="pg ltr ru">
<div class="blob" style="width:380px;height:380px;background:#BFD330;bottom:-190px;right:-150px"></div>
<span class="tag" style="background:#BFD330">Что такое бешенство?</span>
<h2>Вирус, поражающий нервную систему.</h2>
<div class="row"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s1"/></svg><div><b>Смертельно</b><span>После появления симптомов эффективного лечения нет</span></div></div>
<div class="row"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s2"/></svg><div><b>Передаётся людям</b><span>От всех млекопитающих, через слюну заражённого животного</span></div></div>
<div class="row"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s3"/></svg><div><b>Можно предотвратить</b><span>Прививка домашних животных и профилактическое лечение сразу после контакта</span></div></div>
<div class="ft">Брошюра: бешенство</div><div class="pn" style="background:#BFD330">4</div>
</section>

<span class="tag" style="background:#00A8CB;color:#fff;background:#005589">Как оно передаётся?</span>
<h2>Всё дело в слюне.</h2>
<div class="flow">
<div class="st"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s4"/></svg><b>Заражённое животное</b></div>
<svg class="ar" viewBox="0 0 20 26"><use href="#s5"/></svg>
<div class="st"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s6"/></svg><b>Слюна</b></div>
<svg class="ar" viewBox="0 0 20 26"><use href="#s5"/></svg>
<div class="st"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s7"/></svg><b>Укус, царапина, открытая рана</b></div>
</div>
<p style="margin-top:22px;font-size:23px;font-weight:800;text-align:center">Не передаётся по воздуху. Не проникает через неповреждённую кожу.</p>
<div class="ft">Брошюра: бешенство</div><div class="pn" style="background:#005589;color:#fff">5</div>

<span class="tag" style="background:#F5BD17">Кто заражается?</span>
<h2>Все млекопитающие.<br>И мы тоже.</h2>
<div class="grid">
<div class="tile" style="background:#FFF4D6"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s4"/></svg><b>Собаки</b></div>
<div class="tile" style="background:#E6F8FC"><svg class="ill" viewBox="0 0 120 120" aria-hidden="true"><use href="#s8"/></svg><b>Шакалы</b></div>

</div>
<p style="margin-top:20px;font-size:19px"><b>Золотистый шакал</b> — главный природный резервуар болезни в Израиле.</p>
<div style="margin-top:8px"><span style="font-size:18px;font-weight:800">Не заражаются:</span><span class="chip">птицы</span><span class="chip">рептилии</span><span class="chip">рыбы</span><span class="chip">амфибии</span></div>
<div class="ft">Брошюра: бешенство</div><div class="pn" style="background:#F5BD17">6</div>
</section>
<!-- 7 LOOKS HEALTHY -->
<section lang="ru" dir="ltr" class="pg ltr ru">
<div class="blob" style="width:360px;height:360px;background:#00BFDD;top:-200px;right:-140px"></div>
<span class="tag" style="background:#00BFDD">Внимание</span>
<h2>Выглядит здоровым?<br>Не обязательно.</h2>
<p class="lead">Вирус может находиться в организме животного <b>от нескольких недель до нескольких месяцев</b> без каких-либо внешних признаков. Тревожные признаки:</p>
<ul class="signs">
<li><i></i>Изменение поведения: агрессия или, наоборот, вялость</li>
<li><i></i>Дикое животное теряет страх и подходит к жилью</li>
<li><i></i>Обильное слюноотделение, трудно глотать</li>
<li><i></i>Укусы без причины</li>
<li><i></i>Паралич, хождение по кругу, изменение голоса</li>
</ul>
<p style="margin-top:20px;font-size:22px;font-weight:800;color:#005589">Заметили? Не подходите и сообщите в центр 106.</p>
<div class="ft">Брошюра: бешенство</div><div class="pn" style="background:#00BFDD">7</div>
</section>

<span class="tag" style="background:#BFD330">Прививки и золотые правила</span>
<h2 style="font-size:52px">Собака не может<br>записаться к врачу.<br>А вы можете.</h2>
<ul class="rules" style="margin-top:20px">
<li><b>Собаки:</b> обязательная прививка с 3 месяцев. После первых двух прививок — раз в два года.</li>
<li><b>Лицензия:</b> продлевается каждый год. На улице собака на поводке.</li>
<li><b>Кошки:</b> рекомендуется прививать раз в два года, особенно если кошка выходит из дома.</li>
</ul>
<div style="margin-top:14px;background:#005589;color:#fff;border-radius:28px;padding:18px 22px">
<p style="font-size:24px;font-weight:800;color:#F5BD17;margin-bottom:8px">На улице:</p>
<p style="font-size:19px;margin-bottom:6px">Не гладим, не кормим и не забираем домой, даже милого щенка.</p>
<p style="font-size:19px;margin-bottom:6px">Закрываем мусорные баки и не оставляем еду на улице.</p>
<p style="font-size:19px">Спрашиваем детей, не трогали ли они бродячих животных.</p>
</div>
<div class="ft">Брошюра: бешенство</div><div class="pn" style="background:#BFD330">11</div>
</section>

<p class="lead" style="font-weight:800;color:#005589;margin-top:0">የእብድ ውሻ በሽታን መከላከል ይቻላል። ለዚህም ነው በከተማው ያለ እያንዳንዱ ቤተሰብ ምን ማድረግ እንዳለበት እንዲያውቅ የምንፈልገው።</p>
<p style="margin-top:16px">ባለፉት ዓመታት በሽታው በእስራኤል እየተስፋፋ ነው፤ በዚህ ዓመትም ከእኛ ብዙም ሳይርቅ የካርሜል ጠረፍ ደርሷል።</p>
<p style="margin-top:12px">መምሪያው ከከተማው የእንስሳት ሕክምና አገልግሎት ጋር በመሆን ስለ ባዘኑ እንስሳት የሚቀርቡ ጥቆማዎችን ያስተናግዳል፣ ቆሻሻ መነሳቱን ይከታተላል፣ የቤት እንስሳት ባለቤቶችንም በግዴታ ክትባትና ፈቃድ ይደግፋል። ነገር ግን ትልቁ መከላከያ የሚጀምረው ከእያንዳንዳችን ነው፦ ለውሻ የጸና ክትባት፣ የተዘጉ የቆሻሻ ገንዳዎች፣ የባዘኑ እንስሳትን አለመመገብ፣ እና ከማንኛውም ንክሻ ወይም ጭረት በኋላ በፍጥነት ሕክምና መፈለግ።</p>
<div class="sig"><b>አርዬ ቫግነር</b>የከተማ ጽዳትና ውበት መምሪያ ኃላፊ፣ የቲራት ካርሜል ማዘጋጃ ቤት</div>
<div class="ft">የመረጃ ቡክሌት፦ የእብድ ውሻ በሽታ</div><div class="pn" style="background:#F5BD17">2</div>
</section>
<!-- 3 FOREWORD VET -->
<section lang="am" dir="ltr" class="pg ltr am">
<div class="blob" style="width:300px;height:300px;background:#00BFDD;top:-150px;right:-110px"></div>
<span class="tag" style="background:#00BFDD">የከተማው የእንስሳት ሐኪም መልእክት</span>
<div class="quote" style="color:#00BFDD">”</div>
<p class="lead" style="font-weight:800;color:#005589;margin-top:0">እንስሳ ቫይረሱን ተሸክሞ ሙሉ በሙሉ ጤናማ መስሎ ሊታይ ይችላል።</p>
<p style="margin-top:16px">ስለዚህ በመንገድ ላይ ያለ ቆንጆ ቡችላም ቢሆን ወደ ቤት አይወሰድም። መርዳት ይፈልጋሉ? ያሳውቁን፤ እኛ እንከታተላለን።</p>
<p style="margin-top:12px">ምልክቶች ከታዩ በኋላ በሽታው ሁልጊዜ ማለት ይቻላል ገዳይ ነው። ነገር ግን እሱን ለመከላከል በጣም ውጤታማ መንገዶች አሉን፦ ለቤት እንስሳት ክትባት፣ እና ለሰዎች ከንክኪ በኋላ በጊዜ የሚሰጥ የመከላከያ ሕክምና።</p>
<p style="margin-top:12px">ውሻዎ ባለፉት ሁለት ዓመታት ካልተከተበ፣ ቀጠሮ የሚይዙበት ጊዜ አሁን ነው። የከተማው የእንስሳት ሕክምና አገልግሎት ለእርስዎ እዚህ አለ።</p>
<div class="sig"><b>ዶ/ር ኢዶ ሺዮን</b>የከተማው የእንስሳት ሐኪም፣ የቲራት ካርሜል ማዘጋጃ ቤት</div>
<div class="ft">የመረጃ ቡክሌት፦ የእብድ ውሻ በሽታ</div><div class="pn" style="background:#00BFDD">3</div>
</section>

<div style="position:absolute;bottom:50px;right:48px;background:#fff;border-radius:18px;padding:10px 14px"><img src="https://cdn.jsdelivr.net/gh/tiratcarmel2026/-@513d95d2548109e35e46641661026ab55879b3f7/logo.webp" style="height:70px;display:block" alt="የቲራት ካርሜል ማዘጋጃ ቤት"></div>

</template>
<script>
{
const UI={
he:{dir:'rtl',prev:'→ הקודם',next:'הבא ←',cover:'שער',one:(a,t)=>`עמוד ${a} מתוך ${t}`,two:(a,b,t)=>`עמודים ${a}–${b} מתוך ${t}`,title:'כלבת: חוברת מידע'},
ru:{dir:'ltr',prev:'← Назад',next:'Далее →',cover:'Обложка',one:(a,t)=>`Стр. ${a} из ${t}`,two:(a,b,t)=>`Стр. ${a}–${b} из ${t}`,title:'Бешенство: брошюра'},
am:{dir:'ltr',prev:'← ቀዳሚ',next:'ቀጣይ →',cover:'ሽፋን',one:(a,t)=>`ገጽ ${a} ከ${t}`,two:(a,b,t)=>`ገጽ ${a}–${b} ከ${t}`,title:'የእብድ ውሻ በሽታ፦ ቡክሌት'}
};
const PAGES={};for(const l of Object.keys(UI))PAGES[l]=[...document.getElementById('pages-'+l).content.querySelectorAll('.pg')];
const book=document.getElementById('book'),scaler=document.getElementById('scaler'),stage=document.getElementById('stage');
const prevB=document.getElementById('prev'),nextB=document.getElementById('next'),count=document.getElementById('count'),bar=document.querySelector('.bar');
const PW=560,PH=792;
let lang='he',spread=null,leaves=[],cur=0,pageIndex=0;
const ltr=()=>UI[lang].dir==='ltr';
const isSpread=()=>window.innerWidth>=900&&window.innerWidth/window.innerHeight>1.1;
const mkFace=(cls,pg)=>{const f=document.createElement('div');f.className='face '+cls;if(pg)f.appendChild(pg.cloneNode(true));else f.classList.add('blank');return f};
function curPage(){return spread?Math.max(0,cur*2-1):cur}
function build(){
const pages=PAGES[lang],sp=isSpread();
spread=sp;book.innerHTML='';leaves=[];
book.classList.toggle('single',!sp);book.classList.toggle('ltrbook',ltr());
const n=sp?Math.ceil(pages.length/2):pages.length;
for(let i=0;i<n;i++){
const l=document.createElement('div');l.className='leaf';
l.appendChild(mkFace('front',sp?pages[i*2]:pages[i]));
l.appendChild(mkFace('back',sp?pages[i*2+1]:null));
l.style.transition='none';l.style.left=(sp&&ltr()?PW:0)+'px';
book.appendChild(l);leaves.push(l);
}
cur=sp?Math.min(n,Math.ceil(pageIndex/2)):Math.min(n-1,pageIndex);
book.style.width=(sp?PW*2:PW)+'px';book.style.height=PH+'px';
const u=UI[lang];document.documentElement.lang=lang;document.documentElement.dir=u.dir;document.title=u.title;
bar.dir=u.dir;prevB.textContent=u.prev;nextB.textContent=u.next;
document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
render();fit();fitPages();
requestAnimationFrame(()=>requestAnimationFrame(()=>leaves.forEach(l=>l.style.transition='')));
}
function render(){
const n=leaves.length,u=UI[lang],tot=PAGES[lang].length;
leaves.forEach((l,i)=>{const f=i<cur;l.classList.toggle('flipped',f);if(!l.dataset.busy)l.style.zIndex=f?i+1:2*n-i});
let shift=0;if(spread){if(cur===0)shift=PW/2;else if(cur===n)shift=-PW/2;if(ltr())shift=-shift}
book.style.translate=shift+'px 0';
prevB.disabled=cur===0;nextB.disabled=spread?cur===n:cur===n-1;
if(spread)count.textContent=cur===0?u.cover:cur*2+1>tot?u.one(tot,tot):u.two(cur*2,cur*2+1,tot);
else count.textContent=u.one(cur+1,tot);
pageIndex=curPage();
}
function go(d){
const n=leaves.length,max=spread?n:n-1,t=cur+d;if(t<0||t>max)return;
const l=leaves[d>0?cur:t];l.dataset.busy=1;l.style.zIndex=3*n;
cur=t;render();
clearTimeout(l._t);l._t=setTimeout(()=>{delete l.dataset.busy;render()},880);
}
function fitPages(){
for(const pg of book.querySelectorAll('.pg')){
if(pg.dataset.cover!==undefined)continue;
const kids=[...pg.children];
const flow=kids.filter(k=>getComputedStyle(k).position!=='absolute');
const pr=pg.getBoundingClientRect(),r=pr.height/PH;if(!r)continue;
const top=el=>(el.getBoundingClientRect().top-pr.top)/r,bot=el=>(el.getBoundingClientRect().bottom-pr.top)/r;
let limit=PH-92;
for(const k of kids){if(getComputedStyle(k).position!=='absolute'||k.classList.contains('blob')||k.classList.contains('pn')||k.classList.contains('ft'))continue;const t=top(k);if(t>380)limit=Math.min(limit,t-12)}
let z=1;flow.forEach(k=>k.style.zoom='');
while(z>.6&&Math.max(...flow.map(bot))>limit){z-=.03;flow.forEach(k=>k.style.zoom=z)}
}
}
function fit(){
const W=stage.clientWidth-24,H=stage.clientHeight-24,bw=spread?PW*2:PW;
const s=Math.min(W/bw,H/PH);
book.style.transform=`scale(${s})`;scaler.style.width=bw*s+'px';scaler.style.height=PH*s+'px';
}
function setLang(l){if(!UI[l]||l===lang&&spread!==null)return;lang=l;try{history.replaceState(null,'',l==='he'?location.pathname+location.search:'#'+l)}catch(e){}build()}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
prevB.addEventListener('click',()=>go(-1));nextB.addEventListener('click',()=>go(1));
document.addEventListener('keydown',e=>{const nx=ltr()?'ArrowRight':'ArrowLeft',pv=ltr()?'ArrowLeft':'ArrowRight';if(e.key===nx)go(1);if(e.key===pv)go(-1)});
let sx=null,sy=null;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){const fwd=ltr()?dx<0:dx>0;go(fwd?1:-1)}sx=null},{passive:true});
stage.addEventListener('click',e=>{if(e.target.closest('button,a'))return;const r=stage.getBoundingClientRect(),left=e.clientX<r.left+r.width/2;go((ltr()?!left:left)?1:-1)});
let rt;const ro=new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(isSpread()!==spread)build();else{fit();fitPages()}},80)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);setLang(UI[h]?h:'he')});
const h0=location.hash.slice(1);lang=UI[h0]?h0:'he';build();ro.observe(stage);document.fonts&&document.fonts.ready.then(()=>{fit();fitPages()});
}
</script>
